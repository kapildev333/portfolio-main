<!--
  ============================================================================
  PROJECT SCHEMATICS - visual language
  ============================================================================
  Four inline SVGs, one per project card. Each <svg> is self-contained (its own
  <style>, <defs> and marker ids) so it can be lifted straight into index.html.

  STROKE
    solid              synchronous call - caller blocks on the reply
    dashed (4 3)       asynchronous / queued / streamed - events, hand-offs,
                       telemetry. Consistent across all four diagrams.
    weight 1.1         inert node outlines (currentColor, 55% opacity)
    weight 1.3         live data paths

  SHAPE  (carries the meaning - colour only reinforces it)
    rectangle          service / process / compute
    parallelogram      external input arriving from outside the system
    stacked slabs      a stream of events (many of the above)
    hexagon            gate / boundary / policy layer - traffic must pass it
    diamond            decision point
    drum (capped bar)  durable store or log (db, kafka topic, audit log)
    ruled rectangle    queue (internal dividers = pending items)
    dashed vertical    trust / process boundary
    filled dot         junction - a path splitting or merging
    axes + polyline    the one small data-shape per card (metric / ranking)

  COLOUR  (redundant with shape + dash - safe to read in greyscale)
    var(--cy)  #5ee7ff   primary happy path
    var(--vi)  #a78bfa   secondary, branch, telemetry
    var(--muted) #8a93a8 labels
    var(--line)          inert frames and axes
    currentColor         node outlines and key labels, inherits page ink

  TYPE  monospace, 9px in viewBox space, uppercase, letter-spacing .8
  ============================================================================
-->
<meta charset="utf-8">
<title>Project schematics</title>
<style>
  :root{
    --bg:#06070a; --ink:#eef1f7; --muted:#8a93a8;
    --line:rgba(255,255,255,.09); --cy:#5ee7ff; --vi:#a78bfa;
  }
  body{background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,monospace;margin:0;padding:2rem}
  section{max-width:640px;margin:0 auto 3.5rem}
  h2{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cy);font-weight:500;margin:0 0 .9rem}
</style>
