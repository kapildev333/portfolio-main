<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image source · 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06070a;--ink:#eef1f7;--muted:#8a93a8;--cy:#5ee7ff;--vi:#a78bfa}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000}

  .card{
    width:1200px;height:630px;overflow:hidden;
    position:relative;background:var(--bg);color:var(--ink);
    display:flex;align-items:center;gap:64px;padding:0 76px;
    font-family:"Inter",system-ui,sans-serif;
  }
  /* subtle cyan glow, violet counterweight — same register as the site */
  .card::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(760px 520px at 14% 22%, rgba(94,231,255,.16), transparent 62%),
      radial-gradient(620px 460px at 88% 96%, rgba(167,139,250,.11), transparent 66%);
  }
  .card > *{position:relative}

  .left{flex:1;min-width:0}
  .mark{display:block;height:44px;width:auto;color:var(--cy)}
  .name{
    font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;
    font-size:96px;line-height:1;letter-spacing:-.03em;margin-top:34px;
  }
  .role{font-size:34px;font-weight:500;color:var(--muted);margin-top:22px;letter-spacing:-.01em}
  .stack{
    font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400;
    font-size:26px;color:var(--muted);margin-top:20px;letter-spacing:.02em;white-space:nowrap;
  }
  .rule{height:1px;background:rgba(255,255,255,.12);margin:34px 0 30px;width:560px}
  .statement{
    font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;
    font-size:56px;line-height:1;letter-spacing:-.02em;color:var(--cy);
  }

  .portrait{
    flex:none;width:340px;height:340px;border-radius:32px;overflow:hidden;
    background:#0b0d13;box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 0 0 10px rgba(94,231,255,.07);
  }
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <svg class="mark" viewBox="0 0 51 32" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4V28"/>
        <path d="M8 16 20 4"/>
        <path d="M8 16 20 28"/>
        <path d="M43 7 40 4H31L28 7v6l3 3h9l3 3v6l-3 3H31l-3-3"/>
      </g>
      <circle cx="8" cy="16" r="4" fill="currentColor"/>
    </svg>
    <div class="name">Kapil Soni</div>
    <div class="role">Backend &amp; Platform Engineer</div>
    <div class="stack">Go · Kubernetes · Kafka · Montréal</div>
    <div class="rule"></div>
    <div class="statement">Boring to run.</div>
  </div>
  <div class="portrait"><img src="../assets/img/kapil.jpg" alt="Kapil Soni"></div>
</div>
</body>
</html>
